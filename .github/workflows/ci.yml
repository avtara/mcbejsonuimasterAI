name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - name: Install locked dependencies including visual test libraries
        run: npm ci --no-fund --no-audit
      - name: Setup (vanilla index, env check)
        run: node tools/setup.mjs
      - name: Doctor (quick)
        run: node tools/doctor.mjs --quick
      - name: Repository audit and test suite
        run: npm run check
